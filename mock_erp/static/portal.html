<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CentrAlign Enterprise Financial Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .toast { transition: all 0.3s ease; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

  <!-- Navigation Bar -->
  <header class="bg-indigo-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded bg-indigo-500 flex items-center justify-center font-bold text-lg">C</div>
        <h1 class="text-xl font-bold tracking-tight">CentrAlign ERP Financial Portal</h1>
      </div>
      <div class="flex items-center space-x-4 text-sm">
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
          ● System Operational
        </span>
        <span class="text-indigo-200">Operator: AutoBot-01</span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h2 class="text-2xl font-bold text-gray-900">Accounts Payable Invoices</h2>
        <p class="text-sm text-gray-500">Internal company ledger and accounts receivable registry</p>
      </div>
      <button id="open-invoice-modal-btn" onclick="openModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 flex items-center space-x-2">
        <span>+ Record New Invoice</span>
      </button>
    </div>

    <!-- Alert / Toast Banner -->
    <div id="toast-banner" class="hidden mb-6 p-4 rounded-md border text-sm flex items-center justify-between">
      <span id="toast-message"></span>
      <button onclick="dismissToast()" class="text-gray-500 hover:text-gray-700">&times;</button>
    </div>

    <!-- Invoices Table -->
    <div class="bg-white shadow overflow-hidden sm:rounded-lg border border-gray-200">
      <table class="min-w-full divide-y divide-gray-200" id="invoices-table">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Vendor</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Invoice #</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Due Date</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
          </tr>
        </thead>
        <tbody id="invoices-tbody" class="bg-white divide-y divide-gray-200">
          <!-- Loaded dynamically -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal Dialog -->
  <div id="invoice-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-6 border w-full max-w-md shadow-xl rounded-lg bg-white">
      <div class="flex justify-between items-center pb-3 border-b border-gray-200 mb-4">
        <h3 class="text-lg font-semibold text-gray-900" id="modal-title">Record Vendor Invoice</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold">&times;</button>
      </div>

      <form id="invoice-form" onsubmit="submitInvoice(event)" class="space-y-4">
        <div>
          <label for="vendor-name-input" class="block text-sm font-medium text-gray-700">Vendor Name</label>
          <input type="text" id="vendor-name-input" required placeholder="e.g. Acme Corp" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>

        <div>
          <label for="invoice-number-input" class="block text-sm font-medium text-gray-700">Invoice Reference Number</label>
          <input type="text" id="invoice-number-input" required placeholder="e.g. INV-2025-001" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="amount-input" class="block text-sm font-medium text-gray-700">Amount (USD)</label>
            <input type="number" step="0.01" id="amount-input" required placeholder="0.00" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
          </div>
          <div>
            <label for="due-date-input" class="block text-sm font-medium text-gray-700">Due Date</label>
            <input type="date" id="due-date-input" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
          </div>
        </div>

        <div>
          <label for="notes-input" class="block text-sm font-medium text-gray-700">Notes (Optional)</label>
          <textarea id="notes-input" rows="2" placeholder="Recorded via autonomous agent" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"></textarea>
        </div>

        <div class="pt-4 flex justify-end space-x-3 border-t border-gray-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</button>
          <button type="submit" id="submit-invoice-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-md shadow-sm text-sm">Save Invoice</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    async function fetchInvoices() {
      try {
        const res = await fetch('/invoices');
        const invoices = await res.json();
        const tbody = document.getElementById('invoices-tbody');
        tbody.innerHTML = '';
        invoices.forEach(inv => {
          const tr = document.createElement('tr');
          tr.setAttribute('data-invoice-id', inv.id);
          tr.className = 'hover:bg-gray-50';
          tr.innerHTML = `
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">#${inv.id}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-semibold">${inv.vendor_name}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 font-mono">${inv.invoice_number}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900">$${Number(inv.amount).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${inv.due_date}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm">
              <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">${inv.status}</span>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) {
        console.error('Error fetching invoices', e);
      }
    }

    function openModal() {
      document.getElementById('invoice-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('invoice-modal').classList.add('hidden');
      document.getElementById('invoice-form').reset();
    }

    function showToast(message, isSuccess = true) {
      const banner = document.getElementById('toast-banner');
      const msg = document.getElementById('toast-message');
      msg.textContent = message;
      banner.className = `mb-6 p-4 rounded-md border text-sm flex items-center justify-between ${
        isSuccess ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800'
      }`;
      banner.classList.remove('hidden');
    }

    function dismissToast() {
      document.getElementById('toast-banner').classList.add('hidden');
    }

    async function submitInvoice(e) {
      e.preventDefault();
      const payload = {
        vendor_name: document.getElementById('vendor-name-input').value.trim(),
        invoice_number: document.getElementById('invoice-number-input').value.trim(),
        amount: parseFloat(document.getElementById('amount-input').value),
        due_date: document.getElementById('due-date-input').value,
        notes: document.getElementById('notes-input').value.trim()
      };

      try {
        const res = await fetch('/invoices', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });

        if (res.status === 201) {
          const data = await res.json();
          showToast(`Invoice #${data.invoice_number} successfully registered into company ERP (Record ID ${data.id})!`, true);
          closeModal();
          await fetchInvoices();
        } else if (res.status === 409) {
          const err = await res.json();
          showToast(`Conflict Error: ${err.detail}`, false);
        } else {
          showToast(`Error recording invoice (${res.status})`, false);
        }
      } catch (err) {
        showToast(`Network error: ${err.message}`, false);
      }
    }

    window.addEventListener('DOMContentLoaded', fetchInvoices);
  </script>
</body>
</html>
